<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bug Triage & Resolution Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 50%, #150f24 0%, #05030a 100%);
            --card-bg: rgba(15, 10, 26, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #a855f7;
            --accent-secondary: #ec4899;
            --glow-color: rgba(168, 85, 247, 0.12);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container { width: 100%; max-width: 950px; z-index: 10; }
        header { text-align: center; margin-bottom: 2.5rem; }
        header h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
        }
        header p { color: var(--text-muted); font-size: 1.05rem; font-weight: 300; }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 3rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), 0 0 40px var(--glow-color);
        }

        .form-group { margin-bottom: 2rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #d8b4fe;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent-primary);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }
        .form-group textarea { min-height: 110px; }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            border: none;
            border-radius: 12px;
            padding: 1.1rem;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.25);
            transition: all 0.3s ease;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(236, 72, 153, 0.4);
            filter: brightness(1.1);
        }

        .results-panel {
            margin-top: 3rem;
            display: none;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 2.5rem;
            animation: fadeIn 0.6s ease forwards;
        }

        /* 3-Column Grid for All Six Details */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .result-card i {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-card-content h3 {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
            letter-spacing: 0.05em;
        }
        .result-card-content p { font-size: 1.15rem; font-weight: 700; }

        .badge {
            padding: 0.25rem 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-severity-critical { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-severity-high { background: rgba(249, 115, 22, 0.15); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.3); }
        .badge-severity-medium { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
        .badge-severity-low { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

        .advice-box {
            background: rgba(168, 85, 247, 0.04);
            border: 1px solid rgba(168, 85, 247, 0.12);
            border-radius: 16px;
            padding: 1.75rem;
            display: flex;
            gap: 1.25rem;
            align-items: flex-start;
        }
        .advice-box i { font-size: 1.75rem; color: #d8b4fe; margin-top: 0.25rem; }
        .advice-box h4 { font-size: 1.05rem; font-weight: 600; color: #d8b4fe; margin-bottom: 0.5rem; }
        .advice-box p { font-size: 1rem; line-height: 1.6; color: #e9d5ff; }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>AI Bug Triage Dashboard</h1>
            <p>Comprehensive Bug Report & Intelligent Resolution Recommender</p>
        </header>

        <div class="glass-card">
            <form id="triage-form">
                <div class="form-group">
                    <label for="bug-title">Bug Title</label>
                    <input type="text" id="bug-title" placeholder="e.g. Connection database timeout pool exhausted under load" required>
                </div>
                <div class="form-group">
                    <label for="bug-desc">Bug Description</label>
                    <textarea id="bug-desc" placeholder="Describe the behavior or symptoms in detail..." required></textarea>
                </div>

                <button type="submit" id="submit-button" class="submit-btn">
                    <span id="btn-text"><i class="fa-solid fa-wand-magic-sparkles"></i> Generate Triage Report</span>
                    <div id="btn-spinner" class="spinner"></div>
                </button>
            </form>

            <!-- Results Panel -->
            <div id="results-section" class="results-panel">
                <div class="results-grid">
                    <!-- Bug ID -->
                    <div class="result-card">
                        <i class="fa-solid fa-hashtag"></i>
                        <div class="result-card-content">
                            <h3>Bug ID</h3>
                            <p id="result-id">-</p>
                        </div>
                    </div>
                    <!-- Category -->
                    <div class="result-card">
                        <i class="fa-solid fa-shapes"></i>
                        <div class="result-card-content">
                            <h3>Root Cause Category</h3>
                            <p id="result-category">-</p>
                        </div>
                    </div>
                    <!-- Tech -->
                    <div class="result-card">
                        <i class="fa-solid fa-code"></i>
                        <div class="result-card-content">
                            <h3>Technology</h3>
                            <p id="result-tech">-</p>
                        </div>
                    </div>
                    <!-- Module -->
                    <div class="result-card">
                        <i class="fa-solid fa-cube"></i>
                        <div class="result-card-content">
                            <h3>Module</h3>
                            <p id="result-module">-</p>
                        </div>
                    </div>
                    <!-- Environment -->
                    <div class="result-card">
                        <i class="fa-solid fa-server"></i>
                        <div class="result-card-content">
                            <h3>Environment</h3>
                            <p id="result-env">-</p>
                        </div>
                    </div>
                    <!-- Severity & Priority -->
                    <div class="result-card">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <div class="result-card-content">
                            <h3>Severity / Priority</h3>
                            <div>
                                <span id="result-severity" class="badge">-</span>
                                <span id="result-priority" class="badge" style="background: rgba(255,255,255,0.05); color: #fff; margin-left: 0.5rem;">-</span>
                            </div>
                        </div>
                    </div>
                    <!-- Resolution Time -->
                    <div class="result-card">
                        <i class="fa-solid fa-hourglass-half"></i>
                        <div class="result-card-content">
                            <h3>Est. Resolution Time</h3>
                            <p id="result-time">-</p>
                        </div>
                    </div>
                </div>

                <!-- Recommendation Box -->
                <div class="advice-box">
                    <i class="fa-solid fa-lightbulb"></i>
                    <div>
                        <h4>Recommended Action Plan</h4>
                        <p id="result-action">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('triage-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const titleInput = document.getElementById('bug-title').value;
            const descInput = document.getElementById('bug-desc').value;
            const submitBtn = document.getElementById('submit-button');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const resultsSection = document.getElementById('results-section');
            
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'block';
            resultsSection.style.display = 'none';
            
            try {
                const response = await fetch('/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Bug_Title: titleInput, Bug_Description: descInput })
                });
                
                if (!response.ok) throw new Error('API Request failed');
                
                const data = await response.json();
                
                document.getElementById('result-id').textContent = data.bug_id;
                document.getElementById('result-category').textContent = data.predicted_category;
                document.getElementById('result-tech').textContent = data.predicted_technology;
                document.getElementById('result-module').textContent = data.predicted_module;
                document.getElementById('result-env').textContent = data.predicted_environment;
                document.getElementById('result-priority').textContent = data.suggested_priority;
                
                const sevBadge = document.getElementById('result-severity');
                sevBadge.textContent = data.predicted_severity;
                sevBadge.className = 'badge';
                sevBadge.classList.add('badge-severity-' + data.predicted_severity.toLowerCase());
                
                const hours = data.estimated_resolution_time_hours;
                document.getElementById('result-time').textContent = hours + (hours === 1 ? ' Hour' : ' Hours');
                document.getElementById('result-action').textContent = data.recommended_action;
                
                resultsSection.style.display = 'block';
            } catch (error) {
                alert('Error connecting to triage API.');
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                btnText.style.display = 'flex';
                btnSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
